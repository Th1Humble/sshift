<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sshift</title>
    <style>
      :root {
        color-scheme: light;
        --text: #172033;
        --muted: #5c667a;
        --line: #d8dde7;
        --code: #f4f6fa;
        --accent: #1769e0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: #ffffff;
      }

      main {
        width: min(100%, 760px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 44px;
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.6;
      }

      pre {
        margin: 28px 0 20px;
        padding: 18px 20px;
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--code);
        color: var(--text);
        font-size: 15px;
        line-height: 1.5;
      }

      code {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          monospace;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>sshift</h1>
      <p>Use the right SSH key for every Git repo.</p>

      <pre><code>curl -fsSL https://th1humble.github.io/sshift/install.sh | sh</code></pre>

      <nav aria-label="Project links">
        <a href="https://github.com/Th1Humble/sshift">GitHub</a>
        <a href="https://github.com/Th1Humble/sshift/releases">Releases</a>
        <a href="./install.sh">install.sh</a>
      </nav>
    </main>
  </body>
</html>
